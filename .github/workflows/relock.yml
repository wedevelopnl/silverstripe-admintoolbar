name: Relock harness dependencies

# The harness installs from a committed lock so a container boot never
# re-resolves against Packagist. That lock would otherwise freeze the
# Silverstripe version the module is tested against, so regenerate it weekly
# and raise a PR — the float is still followed, deliberately and CI-gated.

on:
  schedule:
    # Mondays 04:00 UTC — after the weekend's upstream releases have settled.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relock:
    name: Regenerate composer lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - run: task relock

      - name: Open a pull request if anything moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- .docker/app/composer.lock; then
            echo "Lock already current — nothing to raise."
            exit 0
          fi

          branch="chore/relock-$(date -u +%Y-%m-%d)"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add .docker/app/composer.lock
          git commit -m 'Relock the container harness'
          git push --force-with-lease origin "$branch"

          # `|| true` covers a re-run: the branch already carries an open PR,
          # and pushing to it is the whole update.
          # The body's backticks are literal Markdown, not command substitution.
          # shellcheck disable=SC2016
          gh pr create \
            --base 6 \
            --head "$branch" \
            --title 'Relock the container harness' \
            --body 'Weekly regeneration of the container composer lock, so the harness keeps testing against current Silverstripe 6.x releases. Generated by `.github/workflows/relock.yml`; reproduce locally with `task relock`.' \
            || true
      - name: Container diagnostics
        if: failure()
        uses: ./.github/actions/container-diagnostics
        with:
          compose: ${{ env.COMPOSE }}
