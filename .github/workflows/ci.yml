name: CI

on:
  push:
    branches: ['6']
  pull_request:
    branches: ['6']
  # relock.yml dispatches CI on its branch: its GITHUB_TOKEN push and PR start
  # no pull_request run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrictive default for every job; jobs that publish check runs opt in.
permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      # Authenticated pulls lift Docker Hub's anonymous rate limit. Guarded on
      # the secret so fork/Dependabot PRs fall back to anonymous pulls.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - name: Build image (GHA layer cache)
        run: $COMPOSE build app
      - name: Start services
        run: $COMPOSE up -d --wait app
      # Composer never re-checks a path package's requirements when installing
      # from a lock, so a new module dependency would otherwise be silently
      # absent from every job.
      - name: Verify the lock covers the module
        run: $COMPOSE exec -T app /app/verify-lock.sh
      - run: task analyse
      - run: task analyse-php85
      - run: task rector-dry
      - run: task class-leak
      - name: Container diagnostics
        if: failure()
        uses: ./.github/actions/container-diagnostics
        with:
          compose: ${{ env.COMPOSE }}

  php-qa:
    name: PHP QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # Fail fast on a degraded runner instead of burning minutes; a re-run lands
    # on a fresh one.
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', coverage: true }
          - { php: '8.4', coverage: false }
          - { php: '8.5', coverage: false }
    env:
      PHP_VERSION: ${{ matrix.php }}
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php${{ matrix.php }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - name: Build image (GHA layer cache)
        run: $COMPOSE build app
      - name: Start services
        run: $COMPOSE up -d --wait app
      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: $COMPOSE exec -T app vendor/bin/phpunit -c /harness/phpunit.xml.dist --log-junit coverage/junit.xml
      # One leg owns coverage: the gate measures the same code on every PHP version.
      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: $COMPOSE exec -T app vendor/bin/phpunit -c /harness/phpunit.xml.dist --log-junit coverage/junit.xml --coverage-clover coverage/clover.xml
      - name: Check coverage (90% minimum)
        if: ${{ matrix.coverage }}
        run: $COMPOSE exec -T app vendor/bin/coverage-check coverage/clover.xml 90
      - name: Container diagnostics
        if: failure()
        uses: ./.github/actions/container-diagnostics
        with:
          compose: ${{ env.COMPOSE }}
      # A fork PR's token is read-only whatever `permissions` asks for, so the
      # check run cannot be written; the job result still reflects PHPUnit.
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && !github.event.pull_request.head.repo.fork
        with:
          name: PHPUnit Results (PHP ${{ matrix.php }})
          path: coverage/junit.xml
          reporter: java-junit

  js-qa:
    name: JavaScript QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The E2E typecheck resolves @wedevelop/e2e from vendor/wedevelopnl/silverstripe-e2e.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: intl
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - name: Verify the built bundle is committed
        run: |
          npm run build
          git diff --exit-code -- client/dist
          untracked="$(git status --porcelain --untracked-files=all -- client/dist | grep '^??' || true)"
          if [ -n "$untracked" ]; then
            echo "Untracked build output — run npm run build and commit client/dist:"
            echo "$untracked"
            exit 1
          fi
      # A fork PR's token is read-only whatever `permissions` asks for, so the
      # check run cannot be written; the job result still reflects Vitest.
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && !github.event.pull_request.head.repo.fork
        with:
          name: Vitest Results
          path: reports/vitest-junit.xml
          reporter: java-junit

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Playwright runs on the runner and imports the fixture client from
      # vendor/wedevelopnl/silverstripe-e2e, so composer deps must exist on the
      # runner (the Docker image's vendor volume is not visible to the host).
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: intl
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - run: npm ci
      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # On a cache hit the browser binaries are already restored, so install
      # without --with-deps to skip the apt-get of system libraries.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/cache/save@v6
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - name: Build image (GHA layer cache)
        run: $COMPOSE build app
      - name: Start services
        run: $COMPOSE up -d --wait app
      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html,junit
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright-junit.xml
      - name: Container diagnostics
        if: failure()
        uses: ./.github/actions/container-diagnostics
        with:
          compose: ${{ env.COMPOSE }}
      # A fork PR's token is read-only whatever `permissions` asks for, so the
      # check run cannot be written; the job result still reflects Playwright.
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always() && !github.event.pull_request.head.repo.fork
        with:
          name: E2E Results (${{ matrix.browser }})
          path: reports/playwright-junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
