# Toolbar specs: one published page (post-action) and one that is never published.
# All pages use the 'e2e-' URLSegment prefix.
Page:
  e2e_published:
    Title: 'E2E Published'
    URLSegment: 'e2e-published'
    Content: '<p>Published content</p>'
  e2e_draft:
    Title: 'E2E Draft'
    URLSegment: 'e2e-draft'
    Content: '<p>Draft content</p>'
