# Grid menu specs: two zones (main + sidebar) on one page, from silverstripe-grid's
# MultiZone fixture.
#
# Structure:
#   MultiZonePage (E2E Multi-Zone Page):
#     Zone "main":
#       Section Main-Alpha (Sort: 1, ShowTitle: 1)
#         Row → Column → Block Main-1
#       Section Main-Beta (Sort: 2, ShowTitle: 1)
#         Row → Column → Block Main-2
#     Zone "sidebar":
#       Section Sidebar-Alpha (Sort: 1, ShowTitle: 1)
#         Row → Column → Block Sidebar-1
#       Section Sidebar-Beta (Sort: 2, ShowTitle: 1)
#         Row → Column → Block Sidebar-2
#
# Top-down ordering (auto-scaffolding suppressed by FixtureLoader).
# All pages use 'e2e-' URLSegment prefix for cleanup identification.
#
# Elements parent directly to their container via polymorphic has_one (Parent).

App\MultiZonePage:
  e2e_multi_zone:
    Title: 'E2E Multi-Zone Page'
    URLSegment: 'e2e-multi-zone'

# --- Sections (main zone) ---
WeDevelop\Grid\Model\Section:
  main_alpha:
    Title: 'Main-Alpha'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>App\MultiZonePage.e2e_multi_zone
  main_beta:
    Title: 'Main-Beta'
    ShowTitle: 1
    Sort: 2
    Zone: main
    Parent: =>App\MultiZonePage.e2e_multi_zone
  sidebar_alpha:
    Title: 'Sidebar-Alpha'
    ShowTitle: 1
    Sort: 1
    Zone: sidebar
    Parent: =>App\MultiZonePage.e2e_multi_zone
  sidebar_beta:
    Title: 'Sidebar-Beta'
    ShowTitle: 1
    Sort: 2
    Zone: sidebar
    Parent: =>App\MultiZonePage.e2e_multi_zone

# --- Rows ---
WeDevelop\Grid\Model\Row:
  mz_row_ma:
    Title: 'Row Main-Alpha'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.main_alpha
  mz_row_mb:
    Title: 'Row Main-Beta'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.main_beta
  mz_row_sa:
    Title: 'Row Sidebar-Alpha'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.sidebar_alpha
  mz_row_sb:
    Title: 'Row Sidebar-Beta'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.sidebar_beta

# --- Columns ---
WeDevelop\Grid\Model\Column:
  mz_col_ma:
    Title: 'Col Main-Alpha'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.mz_row_ma
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  mz_col_mb:
    Title: 'Col Main-Beta'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.mz_row_mb
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  mz_col_sa:
    Title: 'Col Sidebar-Alpha'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.mz_row_sa
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  mz_col_sb:
    Title: 'Col Sidebar-Beta'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.mz_row_sb
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'

# --- Leaves ---
WeDevelop\Grid\Model\ContentElement:
  block_main_1:
    Title: 'Block Main-1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.mz_col_ma
  block_main_2:
    Title: 'Block Main-2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.mz_col_mb
  block_sidebar_1:
    Title: 'Block Sidebar-1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.mz_col_sa
  block_sidebar_2:
    Title: 'Block Sidebar-2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.mz_col_sb
