# Grid menu specs. Structure (zone main):
#   Section Hero → Row → Column Wide (8/12) → Intro
#                      → Column Narrow (4/12) → Aside
#   Shared block placement Banner (the block's own section is never expanded)
# Auto-scaffolding is suppressed by FixtureLoader (config_overrides).
Page:
  e2e_grid:
    Title: 'E2E Grid Page'
    URLSegment: 'e2e-grid'
    UseGrid: 1

WeDevelop\Grid\Model\SharedBlock:
  e2e_banner:
    Title: 'Banner'

WeDevelop\Grid\Model\Section:
  hero:
    Title: 'Hero'
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_grid
  banner_section:
    Title: 'Banner Section'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\SharedBlock.e2e_banner

WeDevelop\Grid\Model\Row:
  hero_row:
    Title: 'Hero Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.hero

WeDevelop\Grid\Model\Column:
  hero_wide:
    Title: 'Wide'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.hero_row
    GridSettings: '{"default":{"width":8,"offset":0,"visible":true},"overrides":{}}'
  hero_narrow:
    Title: 'Narrow'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.hero_row
    GridSettings: '{"default":{"width":4,"offset":0,"visible":true},"overrides":{}}'

WeDevelop\Grid\Model\ContentElement:
  intro:
    Title: 'Intro'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.hero_wide
    HTML: '<p>Intro text</p>'
  aside:
    Title: 'Aside'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.hero_narrow
    HTML: '<p>Aside text</p>'

WeDevelop\Grid\Model\SharedBlockReference:
  banner_ref:
    Title: 'Banner'
    Sort: 2
    Zone: main
    Block: =>WeDevelop\Grid\Model\SharedBlock.e2e_banner
    Parent: =>Page.e2e_grid
