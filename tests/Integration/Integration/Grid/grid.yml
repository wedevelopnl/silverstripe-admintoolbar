# Container auto-scaffolding is switched off while this loads
# (GridFixture::onBeforeLoadFixtures()), so the tree is exactly what is listed.
Page:
  grid_page:
    Title: 'Grid Page'
    URLSegment: grid-page
    UseGrid: 1
  no_grid_page:
    Title: 'No Grid Page'
    URLSegment: no-grid-page
    UseGrid: 0
  empty_grid_page:
    Title: 'Empty Grid Page'
    URLSegment: empty-grid-page
    UseGrid: 1
  unzoned_grid_page:
    Title: 'Unzoned Grid Page'
    URLSegment: unzoned-grid-page
    UseGrid: 1

App\MultiZonePage:
  multi_page:
    Title: 'Multi Zone Page'
    URLSegment: multi-zone-page
    UseGrid: 1

WeDevelop\Grid\Model\SharedBlock:
  banner:
    Title: 'Banner'

WeDevelop\Grid\Model\Section:
  hero:
    Title: 'Hero'
    Sort: 1
    Zone: main
    Parent: =>Page.grid_page
  # A root from before zones existed: it belongs to no zone and is not listed.
  unzoned:
    Title: 'Unzoned'
    Sort: 1
    Zone: ''
    Parent: =>Page.grid_page
  # Zone-less roots are invalid in grid (wedevelopnl/silverstripe-grid#490) but exist in older data.
  only_unzoned:
    Title: 'Only Unzoned'
    Sort: 1
    Zone: ''
    Parent: =>Page.unzoned_grid_page
  # The shared block's own subtree; a placement never expands into it.
  banner_section:
    Title: 'Banner Section'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\SharedBlock.banner
  no_grid_section:
    Title: 'Ignored'
    Sort: 1
    Zone: main
    Parent: =>Page.no_grid_page
  multi_sidebar:
    Title: 'Sidebar'
    Sort: 1
    Zone: sidebar
    Parent: =>App\MultiZonePage.multi_page
  multi_banner:
    Title: 'Top banner'
    Sort: 1
    Zone: banner
    Parent: =>App\MultiZonePage.multi_page
  multi_main:
    Title: 'Main'
    Sort: 1
    Zone: main
    Parent: =>App\MultiZonePage.multi_page

WeDevelop\Grid\Model\Row:
  hero_row:
    Title: 'Hero Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.hero

WeDevelop\Grid\Model\Column:
  hero_wide:
    Title: 'Wide'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.hero_row
    GridSettings: '{"default":{"width":8,"offset":0,"visible":true},"overrides":{}}'
  hero_narrow:
    Title: 'Narrow'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.hero_row
    GridSettings: '{"default":{"width":4,"offset":0,"visible":true},"overrides":{}}'

WeDevelop\Grid\Model\ContentElement:
  intro:
    Title: 'Intro'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.hero_wide
  # Written with a title (the grid assigns a default on write);
  # GridFixture::untitleAside() empties it.
  aside:
    Title: 'Aside'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.hero_narrow

WeDevelop\Grid\Model\SharedBlockReference:
  banner_ref:
    Title: 'Banner'
    Sort: 2
    Zone: main
    Block: =>WeDevelop\Grid\Model\SharedBlock.banner
    Parent: =>Page.grid_page
